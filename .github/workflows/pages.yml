# Publishes the project's web page (scripts/build-site.mjs) to GitHub Pages.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
# Read-only token; only the deploy job below can publish.
permissions:
  contents: read
# One deployment at a time; a newer push waits rather than cancelling one
# that is publishing.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Links to files in the repository point back at this repository.
      - run: node scripts/build-site.mjs --repo "https://github.com/${{ github.repository }}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
